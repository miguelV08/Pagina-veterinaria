<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="icon" href="./img/huellitas.png" type="image.png">
    <title>Registrar</title>
</head>
<body class="d-flex flex-column min-vh-100">
     <!--Header-->
    <header>
        <div class="container-fluid bg-success text-center">
            <div class="row">
                <div class="col-lg-12">
                    <img src="./img/huellitas.png" class="img-fluid" height="150" width="150">
                </div>
            </div>
        </div>
    </header>

    <!--seccion-->

    <section class="bg-light mb-5 flex-grow-1">
        <div class="container text-center py-2 my-2 flex-grow-1">
            <div class="row">
                <div class="col-lg-12">
                        <h1 class="display-3 fw-bold">registro</h1>
                        <img src="./img/usuario.webp" class="img-fluid" height="100" width="100">
                        <p class="fs-4 fw-bold text-primary">Ingresa tus datos para poder registrarte</p>
                </div>
            </div>
        </div>

            <div class="container text-center border border-dark border-2 rounded p-4">
            <div class="row">
                <div class="col-lg-12">
                    <p class="fs-4 fw-bold text-primary">Datos personales</p>
                     <div class="mb-3 row ">
                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary">Nombre</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="text" placeholder="Nonbre" aria-label="correo@gmail.com">
                                </div>
                        </div>

                          <div class="mb-3 row ">
                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary">Correo</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="text" placeholder="correo@gmail.com" aria-label="correo@gmail.com">
                                </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="inputPassword" class="col-sm-2 col-form-label text-primary">Contraseña</label>
                        <div class="col-sm-10">
                            <input type="password" class="form-control" id="inputPassword" placeholder="********">
                         </div>

                         <p class="fs-4 fw-bold text-primary">Datos de la mascota</p>

                            <div class="mb-3 row ">
                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary">Nombre de la mascota</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="text" placeholder="Nombre" aria-label="correo@gmail.com">
                                </div>
                        </div>

                         <div class="mb-3 row ">
                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary">Especie</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="text" placeholder="Especie" aria-label="correo@gmail.com">
                                </div>
                        </div>

                        <div class="mb-3 row ">
                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary">Raza</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="text" placeholder="Raza" aria-label="correo@gmail.com">
                                </div>
                        </div>


                            <label for="staticEmail" class="col-sm-2 col-form-label text-primary text-left">Sexo</label>

                            <div class="form-check">
                                <input class="form-check-input border border-dark border-1" type="checkbox" value="" id="checkDefault">
                                 <label class="form-check-label" for="checkDefault">
                                    Masculino
                                </label>
                            </div>
                            <div class="form-check">
                                 <input class="form-check-input border border-dark border-1" type="checkbox" value="" id="checkChecked" checked>
                                <label class="form-check-label text-left" for="checkChecked">
                                Femenino
                                </label>
                            </div>

                             <div class="form-check">
                                 <input class="form-check-input border border-dark border-1" type="checkbox" value="" id="checkChecked" checked>
                                <label class="form-check-label text-left" for="checkChecked">
                                Esterilizado
                                </label>
                            </div>
                            
                            <div class="form-check">
                                 <input class="form-check-input border border-dark border-1" type="checkbox" value="" id="checkChecked" checked>
                                <label class="form-check-label text-left" for="checkChecked">
                                Vacunado
                                </label>
                            </div>
                         
                            <a class="mt-4 text-link" href="./politica.html"> Acepto politica de datos</a>
                        
                    </div>
                    <div class="text-center mt-4">
                            <a href="#" class="btn btn-warning text-light w-100">Registrar</a>
                        </div>
                </div>
            </div>
        </div>
    </section>

       <footer>
      <div class="container-fluid bg-success py-5">
        <div class="row">
          <div class="col-lg-6 text-right fw-bold text-light">
            &copy;miguel
          </div>
          <div class="col-lg-6  align-items-left">

          </div>
        </div>
      </div>
      </footer>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>       
</body>
</html>
</body>
</html>
